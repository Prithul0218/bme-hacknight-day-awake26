<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FinanceBuddy</title>
    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
    <div class="login-shell">
        <div class="login-card">
            <h1>FinanceBuddy</h1>
            <p class="subtitle">Sign in to continue</p>

            {% if error %}
            <div class="error-banner">{{ error }}</div>
            {% endif %}

            <form method="post" action="/login" class="login-form">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" placeholder="you@example.com" required>

                <label for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="Enter password" required>

                <button type="submit">Login</button>
            </form>

            <div class="demo-box">
                <p><strong>Demo Users</strong> (all passwords: <code>1234</code>)</p>
                <ul>
                    <li>admin@financebuddy.local</li>
                    <li>management@financebuddy.local</li>
                    <li>finance@financebuddy.local</li>
                    <li>employee@financebuddy.local</li>
                </ul>
            </div>
        </div>
    </div>
</body>
</html>
